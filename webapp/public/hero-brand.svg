<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- subtle dot accent -->
  <g opacity="0.35">
    <circle cx="34" cy="46" r="2.4" fill="#5fa98f"/>
    <circle cx="196" cy="64" r="2.4" fill="#cf9a4a"/>
    <circle cx="206" cy="182" r="2.4" fill="#5fa98f"/>
    <circle cx="28" cy="188" r="2.4" fill="#cf9a4a"/>
  </g>

  <!-- ticket card, slight tilt -->
  <g transform="rotate(-4 120 122)">
    <rect x="46" y="58" width="148" height="128" rx="20" fill="#1c2430"/>
    <rect x="46" y="58" width="148" height="40" rx="20" fill="#cf9a4a"/>
    <rect x="46" y="78" width="148" height="20" fill="#cf9a4a"/>
    <rect x="64" y="112" width="76" height="8" rx="4" fill="#3a4453"/>
    <rect x="64" y="128" width="52" height="8" rx="4" fill="#2a323f"/>
    <!-- dashed divider like a torn ticket -->
    <line x1="46" y1="150" x2="194" y2="150" stroke="#0f141b" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="64" y="162" width="90" height="8" rx="4" fill="#2a323f"/>
  </g>

  <!-- clock badge overlapping bottom-left -->
  <g>
    <circle cx="70" cy="176" r="30" fill="#151b24" stroke="#0c1016" stroke-width="4"/>
    <circle cx="70" cy="176" r="22" fill="#0f141b"/>
    <path d="M70 164v13l9 6" stroke="#e0b568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- confirmation badge overlapping top-right -->
  <g>
    <circle cx="178" cy="70" r="24" fill="#5fa98f"/>
    <path d="M168 70l7 7 13-14" stroke="#0c1016" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
